[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-bedarfsmeldung"
version = "1.1.0"
description = "Automatische Bedarfsmeldung für InvenTree"
requires-python = ">=3.10"
dependencies = [
    "python-docx",
]

[project.entry-points."inventree_plugins"]
bedarfsmeldung = "bedarfsmeldung:BedarfsmeldungPlugin"

[tool.setuptools]
py-modules = ["bedarfsmeldung"]
